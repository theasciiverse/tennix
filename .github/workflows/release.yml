# Builds Tennix for the Asciiverse catalog: one archive per target, named
# <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a SHA256SUMS
# file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v1.3.5-av.1. Linux builds are glibc, built on Ubuntu
# 22.04 so they run on glibc 2.35 and newer: sound goes through rodio's ALSA
# output and gamepads through gilrs and udev, both linked dynamically, so
# the binary needs libasound2 and libudev1 (the manifest's system_deps).
# macOS and Windows use rodio's own output. Rust is pinned to 1.93.1: 1.99
# and 1.100 were seen to hang compiling some crates (rust-lang/rust#164727).
# macOS builds run on macos-15 (Apple silicon) and macos-15-intel. Every job
# has a time limit, and the release publishes whatever built, so one stuck
# runner never holds back the others. The archives carry README.md,
# PATCHES.md and LICENSE.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: tennix
  BIN: tennix
  TAG: ${{ inputs.tag || github.ref_name }}
  RUST: "1.93.1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, test: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, exe: .exe }
          - { target: aarch64-pc-windows-msvc, runner: windows-2022, exe: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST"

      - name: Linux libraries
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Test
        if: matrix.test
        run: cargo test --release --locked

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/$BIN${{ matrix.exe }} || true

      - name: Check Linux links
        if: contains(matrix.target, 'linux')
        run: |
          # libc, libm, libgcc_s, and libasound and libudev, which the manifest declares
          ldd target/${{ matrix.target }}/release/$BIN
          ! ldd target/${{ matrix.target }}/release/$BIN | grep -v -E 'linux-vdso|libc\.so|libm\.so|libgcc_s|ld-linux|libasound|libudev'

      - name: Package for av
        shell: bash
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN${{ matrix.exe }} README.md PATCHES.md LICENSE stage/
          if [ -n "${{ matrix.exe }}" ]; then
            (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)
          else
            strip stage/$BIN || true
            tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Tennix $TAG" \
                 --notes "Tennix, Thomas Perl's tennis game, in the terminal: hold the hit key to fill the power bar, let go to swing, and take on Carl Van Court across the Classic Championship Tour. Its README lists the keys."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
