[package]
name = "tennix"
version = "1.3.5-av.1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Tennix by Thomas Perl, in the terminal: tennis with a power bar, a computer player and a championship tour. Rust + Ratatui"
authors = ["Thomas Perl (Tennix, 2003 on)", "Asciiverse (terminal port, 2026)"]

[dependencies]
ratatui = "0.30"
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }
log = "0.4"
env_logger = "0.11"

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
